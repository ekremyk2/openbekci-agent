version: 2

project_name: openbekci-agent

before:
  hooks:
    - go mod tidy
    - go test -count=1 ./...

builds:
  - id: agent
    main: ./cmd/openbekci-agent
    binary: openbekci-agent
    env:
      - CGO_ENABLED=0
    goos: [linux, windows]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}

archives:
  - id: agent
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - deploy/openbekci-agent.service
      - deploy/agent.example.yaml

checksum:
  name_template: checksums.txt

sboms:
  - artifacts: archive

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"

release:
  draft: true
  prerelease: auto
