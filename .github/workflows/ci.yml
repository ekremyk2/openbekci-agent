name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - name: Test (race detector on Linux)
        if: runner.os == 'Linux'
        run: CGO_ENABLED=1 go test -count=1 -race ./...
      - name: Test
        if: runner.os != 'Linux'
        run: go test -count=1 ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go tool golangci-lint run ./...

  cross-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [linux/amd64, linux/arm64, windows/amd64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build ${{ matrix.target }}
        run: |
          export GOOS="${{ matrix.target }}"; GOOS="${GOOS%/*}"
          export GOARCH="${{ matrix.target }}"; GOARCH="${GOARCH#*/}"
          CGO_ENABLED=0 go build -trimpath ./...
          CGO_ENABLED=0 go build -trimpath -o /dev/null ./cmd/openbekci-agent

  fixtures:
    name: protocol fixtures up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -count=1 ./internal/protocol -run 'TestGenerateFixtures|TestValidFixturesRoundTrip|TestInvalidFixturesRejected'
