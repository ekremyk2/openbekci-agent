# Run with the pinned go-task:  go tool task <name>
version: "3"

vars:
  VERSION:
    sh: git describe --tags --always --dirty 2>/dev/null || echo dev
  LDFLAGS: -s -w -X main.version={{.VERSION}}

tasks:
  default:
    cmds:
      - task: build

  build:
    desc: Build the agent for this machine into bin/
    cmds:
      - go build -trimpath -ldflags "{{.LDFLAGS}}" -o bin/openbekci-agent{{exeExt}} ./cmd/openbekci-agent

  test:
    desc: Run all tests
    cmds:
      - go test -count=1 ./...

  test:race:
    desc: Run all tests with -race (needs cgo and a C compiler)
    env:
      CGO_ENABLED: "1"
    cmds:
      - go test -count=1 -race ./...

  lint:
    desc: go vet and golangci-lint
    cmds:
      - go vet ./...
      - go tool golangci-lint run ./...

  build:linux-arm64:
    desc: Static linux/arm64 binary (Raspberry Pi class)
    env:
      CGO_ENABLED: "0"
      GOOS: linux
      GOARCH: arm64
    cmds:
      - go build -trimpath -ldflags "{{.LDFLAGS}}" -o dist/openbekci-agent-linux-arm64 ./cmd/openbekci-agent

  build:linux-amd64:
    desc: Static linux/amd64 binary
    env:
      CGO_ENABLED: "0"
      GOOS: linux
      GOARCH: amd64
    cmds:
      - go build -trimpath -ldflags "{{.LDFLAGS}}" -o dist/openbekci-agent-linux-amd64 ./cmd/openbekci-agent

  build:windows-amd64:
    desc: Static windows/amd64 binary (guard PC)
    env:
      CGO_ENABLED: "0"
      GOOS: windows
      GOARCH: amd64
    cmds:
      - go build -trimpath -ldflags "{{.LDFLAGS}}" -o dist/openbekci-agent-windows-amd64.exe ./cmd/openbekci-agent

  fixtures:update:
    desc: Regenerate testdata/protocol/v1 from the Go source of truth
    cmds:
      - go test ./internal/protocol -run TestGenerateFixtures -update-fixtures
